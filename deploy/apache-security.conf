ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>

<Directory /var/www/html/config>
    Require all denied
</Directory>
<Directory /var/www/html/includes>
    Require all denied
</Directory>

# The local installer drops tables and restores demo accounts.
<Files "install.php">
    Require all denied
</Files>
